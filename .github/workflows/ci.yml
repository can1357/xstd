name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clang-format
      - name: clang-format check
        run: git ls-files 'includes/**/*.hpp' 'includes/**/*.h' | xargs clang-format --dry-run -Werror

  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-24.04, cxx: g++-14 }
          - { name: linux-clang,  os: ubuntu-24.04, cxx: clang++-18 }
          - { name: macos-clang,  os: macos-15,     cxx: c++ }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B build -DXSTD_BUILD_CHECKS=ON -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: build
        run: cmake --build build
